<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-label="Shubhasmita Sahoo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1419"/>
      <stop offset="55%" stop-color="#151c24"/>
      <stop offset="100%" stop-color="#0f1419"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c9a227" stop-opacity="0"/>
      <stop offset="20%" stop-color="#c9a227" stop-opacity="1"/>
      <stop offset="80%" stop-color="#c9a227" stop-opacity="1"/>
      <stop offset="100%" stop-color="#c9a227" stop-opacity="0"/>
    </linearGradient>
    <style>
      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(8px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      .a1 { animation: fadeUp 0.9s ease 0.15s both; }
      .a2 { animation: fadeUp 0.9s ease 0.35s both; }
      .a3 { animation: fadeUp 0.9s ease 0.55s both; }
      .a4 { animation: fadeUp 0.9s ease 0.75s both; }
    </style>
  </defs>

  <rect width="1200" height="280" fill="url(#bg)"/>

  <!-- subtle frame -->
  <rect x="24" y="24" width="1152" height="232" fill="none" stroke="#2a3542" stroke-width="1"/>
  <rect x="28" y="28" width="1144" height="224" fill="none" stroke="#1c2530" stroke-width="1"/>

  <!-- left accent bar -->
  <rect x="48" y="56" width="3" height="168" fill="#c9a227"/>

  <text class="a1" x="72" y="88"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="15" letter-spacing="4.5" fill="#c9a227">DESIGN VERIFICATION ENGINEER</text>

  <text class="a2" x="72" y="148"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="52" font-weight="700" fill="#eef2f6">Shubhasmita Sahoo</text>

  <rect class="a3" x="72" y="166" width="280" height="1.5" fill="url(#rule)"/>

  <text class="a3" x="72" y="198"
        font-family="'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="16" fill="#9aa7b5">R&amp;D Senior Engineer  ·  Synopsys  ·  Bangalore</text>

  <text class="a4" x="72" y="228"
        font-family="'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="14" fill="#6b7785">Hardware Emulation  ·  SystemVerilog / UVM  ·  SoC &amp; IP Verification</text>

  <!-- right monogram -->
  <g transform="translate(980,78)">
    <rect width="140" height="140" fill="none" stroke="#2a3542" stroke-width="1"/>
    <rect x="8" y="8" width="124" height="124" fill="none" stroke="#c9a227" stroke-width="0.8" opacity="0.7"/>
    <text x="70" y="92" text-anchor="middle"
          font-family="Georgia, 'Times New Roman', serif"
          font-size="42" font-weight="700" fill="#eef2f6">SV</text>
    <text x="70" y="118" text-anchor="middle"
          font-family="'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="11" letter-spacing="2" fill="#9aa7b5">VLSI</text>
  </g>
</svg>
